version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: military_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: military
      POSTGRES_USER: military
      POSTGRES_PASSWORD: military
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
