[tool.poetry]
name = "volonterua"
version = "0.1.0"
description = "VolonterUA MVP backend (FastAPI + SQLAlchemy + Alembic)"
authors = ["Kostia <you@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
fastapi = "^0.115.0"
uvicorn = {version = "^0.30.0", extras = ["standard"]}
SQLAlchemy = "^2.0.36"
alembic = "^1.13.2"
pydantic = "^2.8.2"
pydantic-settings = "^2.4.0"
aiosqlite = "^0.20.0"
# asyncpg = "^0.29.0"  # ← прибрати або:
# asyncpg = {version="^0.29.0", markers='python_version < "3.13"'}
passlib = "^1.7.4"
python-multipart = "^0.0.9"
email-validator = "^2.2.0"
greenlet = "^3.2.4"
asyncpg = "^0.31.0"
psycopg2-binary = "^2.9.11"
bcrypt = "4.0.1"
celery = "^5.6.3"
redis = "^7.4.0"
python-jose = "^3.5.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
httpx = "^0.27.2"
pytest-asyncio = "^0.23.8"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.pytest.ini_options]
asyncio_mode = "auto"
